name: GitHub Release

# A `vX.Y.Z` tag gets a GitHub Release carrying the .vsix and its CHANGELOG
# section. Publishing to the Marketplace, Open VSX and npm is done from the
# releaser's machine by /publish; this workflow needs no registry token.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ext=$(node -p "require('./packages/extension/package.json').version")
          cli=$(node -p "require('./packages/cli/package.json').version")
          echo "tag=$tag extension=$ext cli=$cli"
          test "$tag" = "$ext" && test "$tag" = "$cli"

      - name: Compile
        run: pnpm -r compile

      - name: Test
        run: pnpm -r test

      - name: Package extension
        run: pnpm package:extension

      - name: GitHub Release
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's CHANGELOG section, up to the next `## ` heading.
          awk -v v="## $version" '$0==v{on=1;next} /^## /{if(on)exit} on' packages/extension/CHANGELOG.md > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" "packages/extension/aidlc-$version.vsix" \
                 --title "AIDLC Native $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
