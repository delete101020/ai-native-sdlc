<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.55" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="150" fill="url(#glow)"/>

  <!-- Six-stage loop: a hexagon whose last edge is an arrow back to the start
       (stage 6 feeds the next cycle). -->
  <path d="M256 106 L386 181 L386 331 L256 406 L126 331 L126 181"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126 181 L214 130" fill="none" stroke="#FFFFFF" stroke-opacity="0.9"
        stroke-width="20" stroke-linecap="round"/>
  <path d="M190 112 L226 124 L206 158" fill="none" stroke="#FFFFFF" stroke-opacity="0.9"
        stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage nodes -->
  <g fill="#FFFFFF">
    <circle cx="386" cy="181" r="24"/>
    <circle cx="386" cy="331" r="24"/>
    <circle cx="256" cy="406" r="24"/>
    <circle cx="126" cy="331" r="24"/>
    <circle cx="126" cy="181" r="24"/>
  </g>
  <circle cx="256" cy="106" r="30" fill="#5EEAD4" stroke="#FFFFFF" stroke-width="10"/>

  <!-- AI spark -->
  <path d="M256 186 C264 240 272 248 326 256 C272 264 264 272 256 326 C248 272 240 264 186 256 C240 248 248 240 256 186 Z"
        fill="url(#star)"/>
</svg>
